# 保存到游戏目录 config/rs_integration/plan_ui.toml。
# 递归合成树的展示图主题；覆盖已有文件前请保留玩家自己的配色。
# 颜色支持 #RRGGBB 和 #AARRGGBB。重新打开界面查看效果。

[layout]
panelWidth = 290
listRowHeight = 28
connectorWidth = 1
showNodeNames = true
showLeafNames = false
nodeLabelWidth = 78
minimapWidth = 160
minimapHeight = 100

[colors]
background = "#FF111E17"
