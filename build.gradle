plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, "rs_integration.refmap.json"
    config "rs_integration.mixins.json"
    config "rs_integration.craftflow_compat.mixins.json"
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                rs_integration {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                rs_integration {
                    source sourceSets.main
                }
            }
        }
    }
}

def localModJarsDir = file(providers.gradleProperty('localModJarsDir').getOrElse('libs'))
def localModJars = { String pattern -> fileTree(dir: localModJarsDir, include: [pattern]).files }
def localModJar = { Collection<File> candidates -> candidates.size() == 1 ? candidates.first() : null }
def ironFurnacesOverride = providers.gradleProperty('ironFurnacesCompatibilityJar').map { file(it) }.orNull
def ironFurnacesCandidates = localModJars('*ironfurnaces-*.jar')
def ironFurnacesSource = ironFurnacesOverride ?: localModJar(ironFurnacesCandidates)
def profoundCurseCandidates = localModJars('*profound_curse-*.jar')
def profoundCurseSource = localModJar(profoundCurseCandidates)
def localModVersion = { File source, String modId ->
    if (!source?.isFile()) return null
    def matcher = source.name =~ /${modId}-(.+)\.jar$/
    matcher.find() ? matcher.group(1) : null
}
def ironFurnacesVersion = localModVersion(ironFurnacesSource, 'ironfurnaces')
def profoundCurseVersion = localModVersion(profoundCurseSource, 'profound_curse')

// ForgeGradle 解析本地 Maven 坐标前先处理已有 JAR；缺文件只在相关任务检查。
def normalizeModJar = { String directory, File source, String destination ->
    File targetDirectory = layout.buildDirectory.dir(directory).get().asFile
    if (source?.isFile()) {
        copy {
            from source
            into targetDirectory
            rename { destination }
        }
    }
    targetDirectory
}
def ironFurnacesTestDirectory = normalizeModJar('ironfurnaces-test-libs', ironFurnacesSource,
        "ironfurnaces-${ironFurnacesVersion}.jar")
def botaniaTestDirectory = normalizeModJar('botania-test-libs',
        localModJar(localModJars('*Botania-1.20.1-448-FORGE.jar')), 'botania-1.20.1-448-FORGE.jar')
def arsNouveauTestDirectory = normalizeModJar('ars-nouveau-test-libs',
        localModJar(localModJars('*ars_nouveau-1.20.1-4.12.6-all.jar')), 'ars_nouveau-1.20.1-4.12.6-all.jar')
def profoundCurseDirectory = normalizeModJar('profound-curse-test-libs', profoundCurseSource,
        "profound_curse-${profoundCurseVersion}.jar")
// 切换真实依赖，分别验证农夫乐事两个版本的砧板语义与执行接口。
def farmersDelightVersion = providers.gradleProperty('farmersDelightCompatibilityVersion')
        .getOrElse('1.20.1-1.3.3')
def farmersDelightJar = "FarmersDelight-${farmersDelightVersion}.jar"
def skipMissingTestDependencies = providers.gradleProperty('skipMissingTestDependencies')
        .getOrElse('false').toBoolean()
def runMalumNativeTests = providers.gradleProperty('runMalumNativeTests')
        .getOrElse('false').toBoolean()
def aetherworksTestDirectory = layout.buildDirectory.dir('aetherworks-test-libs').get().asFile
copy {
    from fileTree(dir: localModJarsDir, include: ['*aetherworks-1.20.1-1.1.2.jar'])
    into aetherworksTestDirectory
    rename { 'aetherworks-1.20.1-1.1.2.jar' }
}

// 从文件名识别 Goety 版本，避免多个版本同时进入编译 classpath。
def goetyVersionOf = { jar ->
    def matcher = jar.name.toLowerCase(Locale.ROOT) =~ /goety-(\d+(?:\.\d+)+)/
    matcher.find() ? matcher.group(1) : null
}
def goetyVersionFiles = localModJars('*.jar').findAll {
    goetyVersionOf(it) != null
}
def requestedGoetyCompileVersion = findProperty('goetyCompileVersion')?.toString()
def goetyCompileSource
if (requestedGoetyCompileVersion != null) {
    def matches = goetyVersionFiles.findAll { goetyVersionOf(it) == requestedGoetyCompileVersion }
    goetyCompileSource = localModJar(matches)
} else {
    goetyCompileSource = goetyVersionFiles.max { left, right ->
        def leftParts = goetyVersionOf(left).tokenize('.').collect { it.toInteger() }
        def rightParts = goetyVersionOf(right).tokenize('.').collect { it.toInteger() }
        for (int index = 0; index < Math.max(leftParts.size(), rightParts.size()); index++) {
            int comparison = (index < leftParts.size() ? leftParts[index] : 0)
                    <=> (index < rightParts.size() ? rightParts[index] : 0)
            if (comparison != 0) return comparison
        }
        0
    }
}
def goetyCompileVersion = goetyCompileSource == null ? null : goetyVersionOf(goetyCompileSource)
def modCompileJars = fileTree(dir: localModJarsDir, include: ['*.jar'],
        exclude: ['emi-*.jar', '*irons_spellbooks-1.20.1-3.16.3.jar', 'apothic_staff_rarities-*.jar',
                  'fantasy_ending-1.20.1-2.7.20g-all.jar', 'improve_the_expectations-1.0.2-forge-1.20.1.jar',
                  '*FarmersDelight-1.20.1-*.jar', '*ironfurnaces-*.jar',
                  '*profound_curse-*.jar', '*rs_integration-*.jar']).matching {
    exclude { details ->
        def version = goetyVersionOf(details.file)
        version != null && version != goetyCompileVersion
    }
}
def modCompileDirectory = layout.buildDirectory.dir('mod-compile-libs').get().asFile
def modCompileArtifacts = modCompileJars.files.groupBy {
    it.name[0..-5].replaceAll(/[^A-Za-z0-9_.-]/, '_')
}
modCompileArtifacts.each { artifact, sources ->
    if (sources.size() != 1) {
        throw new GradleException("Local jar names collide after normalization: ${sources}")
    }
    if (artifact == 'until_eternity-1.2.0-all') {
        // 此包的 STORED 条目带数据描述符；重建压缩容器供名称映射使用，保留原始 JAR。
        modCompileDirectory.mkdirs()
        new java.util.zip.ZipFile(sources[0]).withCloseable { sourceZip ->
            new java.util.zip.ZipOutputStream(
                    new FileOutputStream(new File(modCompileDirectory, "${artifact}.jar")))
                    .withCloseable { outputZip ->
                sourceZip.entries().each { entry ->
                    def replacement = new java.util.zip.ZipEntry(entry.name)
                    replacement.time = entry.time
                    outputZip.putNextEntry(replacement)
                    sourceZip.getInputStream(entry).withCloseable { input ->
                        outputZip << input
                    }
                    outputZip.closeEntry()
                }
            }
        }
    } else if (sources[0].name != "${artifact}.jar") {
        copy {
            from sources[0]
            into modCompileDirectory
            rename { "${artifact}.jar" }
        }
    }
}

repositories {
    flatDir { dirs modCompileDirectory }
    flatDir { dirs localModJarsDir }
    flatDir { dirs ironFurnacesTestDirectory }
    flatDir { dirs botaniaTestDirectory }
    flatDir { dirs arsNouveauTestDirectory }
    flatDir { dirs profoundCurseDirectory }
    flatDir { dirs aetherworksTestDirectory }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
    mavenCentral()
}

// 本地模组没有远程元数据，避免逐个访问 Maven 仓库并等待网络超时。
repositories.withType(MavenArtifactRepository).configureEach { repository ->
    repository.content {
        excludeGroup 'local'
        excludeGroup 'local.compile'
    }
}

// 独立基准源集，不进入生产模组；复用单测中的 Minecraft/RS 运行环境。
sourceSets {
    benchmark {
        compileClasspath += sourceSets.test.runtimeClasspath
        runtimeClasspath += sourceSets.test.runtimeClasspath
    }
    apismoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
sourceSets.test.compileClasspath += sourceSets.apismoke.output
sourceSets.test.runtimeClasspath += sourceSets.apismoke.output

def apismokeJarTask = tasks.register('apismokeJar', Jar) {
    dependsOn tasks.named('apismokeClasses')
    archiveFileName = 'rsi_api_smoke-1.0.0.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from sourceSets.apismoke.output
    manifest {
        attributes([
                'Specification-Title'   : 'rsi_api_smoke',
                'Specification-Version' : '1.0.0',
                'Implementation-Title'  : 'RSI API Smoke Test',
                'Implementation-Version': '1.0.0'
        ])
    }
}

reobf {
    apismokeJar {}
}

// 将数百个联动依赖写入参数文件，避免超过 Windows 的进程命令长度上限。
tasks.withType(net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace).configureEach {
    useArgsFile()
}

apismokeJarTask.configure {
    finalizedBy 'reobfApismokeJar'
}

minecraft {
    runs {
        client {
            mods {
                rsi_api_smoke {
                    source sourceSets.apismoke
                }
            }
        }
        server {
            mods {
                rsi_api_smoke {
                    source sourceSets.apismoke
                }
            }
        }
    }
}

// ForgeGradle 在主源码和测试之间共享待映射依赖；未安装的测试 JAR 只在运行测试时检查。
def missingTestJars = []
def localTestMod = { String configuration, String coordinate, String pattern ->
    if (localModJars(pattern).isEmpty()) {
        missingTestJars.add(pattern)
    } else {
        dependencies.add(configuration, fg.deobf(coordinate))
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.13"

    // libs 中的模组依赖必须经 fg.deobf() 映射；Goety 仅保留所选版本。
    // 文件集合不会经过名称映射；使用合法模块名读取本地 JAR 或其规范化副本。
    modCompileArtifacts.keySet().each { artifact ->
        compileOnly fg.deobf("local.compile:${artifact}:local")
    }
    if (profoundCurseVersion != null) {
        compileOnly fg.deobf("local:profound_curse:${profoundCurseVersion}")
    }
    if (ironFurnacesVersion != null) {
        def ironFurnaces = "local:ironfurnaces:${ironFurnacesVersion}"
        compileOnly fg.deobf(ironFurnaces)
        runtimeOnly fg.deobf(ironFurnaces)
        testImplementation fg.deobf(ironFurnaces)
    }

    // A production RS jar in run/mods is not remapped for the userdev namespace.
    // Keep the release artifact compile-only, but provide a deobfuscated runtime copy for dev runs.
    runtimeOnly fg.deobf("local:refinedstorage:1.12.4")
    // runClient smoke-test dependencies must be present in the dev runtime.
    if (new File(localModJarsDir, "jei-${minecraft_version}-forge-${jei_version}.jar").isFile()) {
        runtimeOnly fg.deobf("local:jei-${minecraft_version}-forge:${jei_version}")
    } else {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
    if (new File(localModJarsDir, farmersDelightJar).isFile()) {
        runtimeOnly fg.deobf("local:FarmersDelight:${farmersDelightVersion}")
        apismokeCompileOnly fg.deobf("local:FarmersDelight:${farmersDelightVersion}")
    }

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    // EMI (optional client integration)
    if (new File(localModJarsDir, "emi-${emi_version}+forge.jar").isFile()) {
        compileOnly fg.deobf("local:emi:${emi_version}+forge")
    } else {
        compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    }

    // Curios
    compileOnly fg.deobf("local:curios-forge:5.14.1+1.20.1")

    // JSR-305 annotations (@Nullable / @Nonnull / @ParametersAreNonnullByDefault)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras — common API for @WrapOperation etc. (compile + AP).
    // The annotation processor lives in mixinextras-common.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))

    // Jar-in-Jar: ForgeGradle nests mixinextras-forge.jar inside
    // META-INF/jarjar/ so Forge can do version arbitration at launch.
    // Avoids JPMS split-package conflicts with other mods that also
    // bundle MixinExtras.  Never shade or shadow — that extracts classes
    // into the root and triggers ResolutionException.
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }

    // ── Unit tests ──────────────────────────────────────────────
    // JUnit 5. Tests run against the deobf Minecraft on the compile
    // classpath (ForgeGradle adds it to every source set), so layer-2
    // tests can exercise real ItemStack/NBT after Bootstrap.bootStrap().
    // Ledger boundary tests also use the same remapped RS API as dev runs.
    // This does not bootstrap the mod entry point or a running Forge server.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'io.github.llamalad7:mixinextras-common:0.4.1'
    localTestMod('testImplementation', 'local.compile:SlashBladeResharped-1.20.1-1.8.62:local',
            'SlashBladeResharped-1.20.1-1.8.62.jar')
    testImplementation fg.deobf('local.compile:tarotcards-1.20-1.7.0:local')
    testImplementation fg.deobf("local:refinedstorage:1.12.4")
    // 验证 BD 原生 Key、流体库存以及终端交互，不启动完整游戏。
    testImplementation fg.deobf("local:beyonddimensions:1.20.1-forge-0.7.30")
    localTestMod('testImplementation', 'local:sophisticatedcore:1.20.1-1.2.55.975',
            'sophisticatedcore-1.20.1-1.2.55.975.jar')
    // 使用 Jade 11 的真实接口验证可选的坩埚状态显示。
    testImplementation fg.deobf("local:Jade:1.20.1-forge-11.11.1")
    // 原生沸腾配方会调用 Minecraft 方法，测试依赖必须实际完成名称映射。
    testImplementation fg.deobf('local:embersrekindled:1.20.1-1.3.9')
    localTestMod('testImplementation', 'local.compile:eidolon_repraised-1.20.1-0.3.8.15:local',
            'eidolon_repraised-1.20.1-0.3.8.15.jar')
    // 只有验证 Malum 原生精魂匹配时才需要它的 Lodestone 运行库。
    if (runMalumNativeTests) {
        localTestMod('testImplementation', 'local.compile:malum-1.20.1-1.6.6:local',
                'malum-1.20.1-1.6.6.jar')
        localTestMod('testImplementation', 'local.compile:lodestone-1.20.1-1.6.4.1:local',
                'lodestone-1.20.1-1.6.4.1.jar')
    } else {
        // 默认测试只读取 Malum 的字节码来检查 Mixin 是否适用。
        localTestMod('testRuntimeOnly', 'local.compile:malum-1.20.1-1.6.6:local',
                'malum-1.20.1-1.6.6.jar')
        sourceSets.test.java.exclude '**/mixin/malum/MalumSpiritMatchingTest.java'
    }
    localTestMod('testImplementation', 'local:aetherworks:1.20.1-1.1.2', '*aetherworks-1.20.1-1.1.2.jar')
    testImplementation fg.deobf('local:until_eternity:1.2.0-all')
    testImplementation fg.deobf('local:tacz:1.20.1-1.1.4-hotfix-all')
    // 用实际怪物锅配方和库存接口验证批量适配。
    localTestMod('testImplementation', "local:FarmersDelight:${farmersDelightVersion}", farmersDelightJar)
    // 用原生酿造和装瓶配方验证跨命名空间的水壶材料。
    localTestMod('testImplementation', 'local.compile:farmersrespite-1.20.1-2.1.2:local',
            'farmersrespite-1.20.1-2.1.2.jar')
    // 用烹饪锅原生配方条件验证动态食材、默认填充物与四槽补齐。
    localTestMod('testImplementation', 'local:CrockPot:1.20.1-1.0.4-release', 'CrockPot-1.20.1-1.0.4-release.jar')
    if (!skipMissingTestDependencies
            || new File(localModJarsDir, 'forge-dungeonsdelight-1.20.1-1.3.0.jar').isFile()) {
        localTestMod('testImplementation', 'local:forge-dungeonsdelight:1.20.1-1.3.0',
                'forge-dungeonsdelight-1.20.1-1.3.0.jar')
    } else {
        sourceSets.test.java.exclude '**/mods/dungeonsdelight/MonsterPotCompatibilityTest.java'
        logger.lifecycle('本次打包跳过缺失的 Dungeons Delight 测试依赖，未删除正式联动代码。')
    }
    // 验证魔力石板这类「能力挂在物品堆上」的容器识别与读写；用模块依赖确保 Minecraft 方法完成映射。
    testImplementation fg.deobf('local:botania:1.20.1-448-FORGE')
    testImplementation fg.deobf('local:ars_nouveau:1.20.1-4.12.6-all')
    if (profoundCurseVersion != null) {
        testImplementation fg.deobf("local:profound_curse:${profoundCurseVersion}")
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 混合终端与配方预览测试需要编译、加载 JEI 接口。
    testImplementation "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    testImplementation "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // 书签回归测试需要真实的 JEI 实现类型，仅 API 不包含 IBookmark。
    if (new File(localModJarsDir, "jei-${minecraft_version}-forge-${jei_version}.jar").isFile()) {
        testImplementation fg.deobf("local:jei-${minecraft_version}-forge:${jei_version}")
    } else {
        testImplementation fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }

    benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

// ForgeGradle 的 eventbus 依赖声明为动态的 10.0.+，会在每次打包时
// 查询 Maven metadata。固定到 Forge 1.20.1 开发环境已缓存且兼容的版本，
// 避免代理/证书问题导致整个构建在配置阶段失败。
configurations.configureEach {
    resolutionStrategy.force 'cpw.mods:modlauncher:10.0.9'
}

def verifyLocalModJarsTask = tasks.register('verifyLocalModJars') {
    group = 'verification'
    description = '检查正式联动编译所需的本地模组 JAR。'
    doLast {
        def problems = []
        if (ironFurnacesVersion == null) {
            def candidates = ironFurnacesOverride == null ? ironFurnacesCandidates : [ironFurnacesOverride]
            problems.add("Iron Furnaces：需要一个 ironfurnaces-<版本>.jar，例如 ironfurnaces-1.20.1-4.1.8.jar；找到 ${candidates}")
        }
        if (profoundCurseVersion == null) {
            problems.add("Profound Curse：需要一个 profound_curse-<版本>.jar，例如 profound_curse-1.1.9.jar；找到 ${profoundCurseCandidates}")
        }
        if (goetyCompileSource == null) {
            def expected = requestedGoetyCompileVersion ?: '<版本>'
            problems.add("Goety：需要 goety-${expected}.jar；找到 ${goetyVersionFiles}")
        }
        [
                'Botania-1.20.1-448-FORGE.jar',
                'ars_nouveau-1.20.1-4.12.6-all.jar',
                'until_eternity-1.2.0-all.jar',
                'beyonddimensions-1.20.1-forge-0.7.30.jar',
                'embersrekindled-1.20.1-1.3.9.jar',
                'Jade-1.20.1-forge-11.11.1.jar',
                'tacz-1.20.1-1.1.4-hotfix-all.jar',
                'tarotcards-1.20-1.7.0.jar',
                'refinedstorage-1.12.4.jar',
                'curios-forge-5.14.1+1.20.1.jar'
        ].each { name ->
            def candidates = localModJars("*${name}")
            if (candidates.size() != 1) {
                problems.add("${name}：需要一个匹配文件；找到 ${candidates}")
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("本地模组目录 ${localModJarsDir} 中有缺失或重复的编译依赖：\n - "
                    + problems.join('\n - ')
                    + '\n请检查 Git 检出是否完整，以及是否指定了正确的依赖目录。')
        }
    }
}

def verifyTestModJarsTask = tasks.register('verifyTestModJars') {
    group = 'verification'
    description = '检查单元测试所需的本地模组 JAR。'
    doLast {
        if (!missingTestJars.isEmpty()) {
            throw new GradleException("本地模组目录 ${localModJarsDir} 缺少测试依赖：\n - "
                    + missingTestJars.join('\n - '))
        }
    }
}

def verifyApiSmokeModJarsTask = tasks.register('verifyApiSmokeModJars') {
    doLast {
        if (!new File(localModJarsDir, farmersDelightJar).isFile()) {
            throw new GradleException("联动冒烟测试需要 ${new File(localModJarsDir, farmersDelightJar)}")
        }
    }
}

compileBenchmarkJava {
    options.encoding = 'UTF-8'
}

// 用 manifest 承载长 classpath，避免 Windows 下 JMH fork 超出命令长度。
tasks.register('benchmarkClasspath', Jar) {
    dependsOn tasks.named('benchmarkClasses')
    archiveFileName = 'benchmark-classpath.jar'
    destinationDirectory = layout.buildDirectory.dir('benchmark')
    doFirst {
        manifest.attributes('Class-Path': sourceSets.benchmark.runtimeClasspath.files
                .collect { it.toURI().toASCIIString() }.join(' '))
    }
}

tasks.register('diskBenchmark', JavaExec) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn tasks.named('benchmarkClasspath')
    classpath = files(tasks.named('benchmarkClasspath').flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'
    maxHeapSize = '3g'
    args providers.gradleProperty('benchmarkArgs').getOrElse('-l').split(' ').findAll { !it.isEmpty() }
}

