tasks.register('verifyReleaseJar') {
    dependsOn 'reobfJarJar'
    doLast {
        def archive = tasks.named('jarJar', Jar).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def requiredEntries = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/mods.toml',
                    'META-INF/LICENSE_RS_INTEGRATION',
                    'META-INF/THIRD_PARTY_NOTICES_RS_INTEGRATION.md',
                    'META-INF/licenses/MIT-MixinExtras.txt',
                    'META-INF/jarjar/metadata.json',
                    'META-INF/jarjar/mixinextras-forge-0.4.1.jar',
                    'com/huanghuang/rsintegration/mods/emi/RSEmiPlugin.class',
                    'com/huanghuang/rsintegration/mods/jei/RSJeiPlugin.class',
                    'com/huanghuang/rsintegration/mods/historystages/HistoryStagesCompat.class',
                    'com/huanghuang/rsintegration/feature/ftbquests/FtbQuestSubmissionService.class',
                    'com/huanghuang/rsintegration/crafting/endpoint/CraftStorageEndpoint.class',
                    'com/huanghuang/rsintegration/crafting/progress/CraftProgressTracker.class',
                    'com/huanghuang/rsintegration/api/RSIIntegrationApi.class',
                    'com/huanghuang/rsintegration/api/recipe/RecipeIntegration.class',
                    'com/huanghuang/rsintegration/api/machine/MachineIntegration.class',
                    'com/huanghuang/rsintegration/api/execution/RecipeExecutionIntegration.class',
                    'com/huanghuang/rsintegration/api/resonance/RSIResonanceApi.class',
                    'com/huanghuang/rsintegration/api/resonance/ResonanceInventory.class',
                    'com/huanghuang/rsintegration/api/consumer/RSICraftConsumerApi.class',
                    'com/huanghuang/rsintegration/api/consumer/ConsumerApiCodecs.class',
                    'com/huanghuang/rsintegration/api/machine/gui/RSIMachineGuiApi.class',
                    'com/huanghuang/rsintegration/api/storage/RSIStorageApi.class',
                    'com/huanghuang/rsintegration/feature/goety/GoetyCauldronFeature.class',
                    'com/huanghuang/rsintegration/feature/goety/menu/WitchCauldronMenu.class',
                    'assets/rs_integration/textures/gui/notebook.png',
                    'rs_integration.mixins.json',
                    'rs_integration.craftflow_compat.mixins.json',
                    'rs_integration.refmap.json'
            ]
            requiredEntries.each { entryName ->
                if (zip.getEntry(entryName) == null) {
                    throw new GradleException("Release jar is missing ${entryName}: ${archive}")
                }
            }

            def forbiddenFragments = [
                    'tinypinyin',
                    'ahocorasick',
                    'com/github/promeg/',
                    'dev/emi/emi/'
            ]
            def rsiLicenses = []
            zip.entries().each { entry ->
                def lowerName = entry.name.toLowerCase(java.util.Locale.ROOT)
                forbiddenFragments.each { fragment ->
                    if (lowerName.contains(fragment)) {
                        throw new GradleException(
                                "Release jar contains removed pinyin dependency ${entry.name}: ${archive}")
                    }
                }
                if (lowerName.startsWith('meta-inf/license_rs_integration')) {
                    rsiLicenses.add(entry.name)
                }
            }
            if (rsiLicenses != ['META-INF/LICENSE_RS_INTEGRATION']) {
                throw new GradleException(
                        "Release jar must contain exactly one RSI license, found ${rsiLicenses}: ${archive}")
            }
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')
                        && !entry.name.startsWith('com/huanghuang/rsintegration/')) {
                    throw new GradleException(
                            "Release jar contains unaudited external class ${entry.name}: ${archive}")
                }
            }

            def jarJarMetadataEntry = zip.getEntry('META-INF/jarjar/metadata.json')
            def jarJarMetadata = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(jarJarMetadataEntry))
            def bundledJars = (jarJarMetadata.jars ?: []).collect {
                "${it.identifier.group}:${it.identifier.artifact}"
            }.sort()
            if (bundledJars != ['io.github.llamalad7:mixinextras-forge']) {
                throw new GradleException(
                        "Release jar contains unaudited jar-in-jar dependencies ${bundledJars}: ${archive}")
            }

            ['rs_integration.mixins.json', 'rs_integration.craftflow_compat.mixins.json'].each { configName ->
                def mixinConfigEntry = zip.getEntry(configName)
                def mixinConfig = new groovy.json.JsonSlurper().parse(zip.getInputStream(mixinConfigEntry))
                ['mixins', 'client', 'server'].each { side ->
                    (mixinConfig[side] ?: []).each { mixinName ->
                        def className = "${mixinConfig.package}.${mixinName}".replace('.', '/') + '.class'
                        if (zip.getEntry(className) == null) {
                            throw new GradleException("Mixin config references missing class ${className}: ${archive}")
                        }
                    }
                }
            }

            def modsEntry = zip.getEntry('META-INF/mods.toml')
            def modsToml = zip.getInputStream(modsEntry).getText('UTF-8')
            if (!modsToml.contains("modId = \"${mod_id}\"")
                    || !modsToml.contains("version = \"${project.version}\"")
                    || !modsToml.contains("LICENSE_RS_INTEGRATION")) {
                throw new GradleException("Release mods.toml has unexpanded or incorrect identity: ${archive}")
            }

            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
            def attributes = manifest.mainAttributes
            if (attributes.getValue('Implementation-Version') != project.version.toString()
                    || attributes.getValue('MixinConfigs') != 'rs_integration.mixins.json,rs_integration.craftflow_compat.mixins.json') {
                throw new GradleException("Release manifest has incorrect version or MixinConfigs: ${archive}")
            }

            def classEntry = zip.getEntry('com/huanghuang/rsintegration/ModItems.class')
            if (classEntry == null) {
                throw new GradleException("Release jar is missing ModItems.class: ${archive}")
            }
            def classBytes = zip.getInputStream(classEntry).bytes
            def classData = new String(classBytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (classData.contains('CREATIVE_MODE_TAB')) {
                throw new GradleException("Release jar still contains development mappings: ${archive}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.configureEach {
    if (name == 'reobfJarJar') {
        finalizedBy tasks.named('verifyReleaseJar')
    }
}
