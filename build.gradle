plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, "rs_integration.refmap.json"
    config "rs_integration.mixins.json"
    config "rs_integration.craftflow_compat.mixins.json"
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=rs_integration.mixins.json"
            arg "-mixin.config=rs_integration.craftflow_compat.mixins.json"
            mods {
                rs_integration {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=rs_integration.mixins.json"
            arg "-mixin.config=rs_integration.craftflow_compat.mixins.json"
            mods {
                rs_integration {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
    mavenCentral()
}

// 独立基准源集，不进入生产模组；复用单测中的 Minecraft/RS 运行环境。
sourceSets {
    benchmark {
        compileClasspath += sourceSets.test.runtimeClasspath
        runtimeClasspath += sourceSets.test.runtimeClasspath
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.3.22"

    // All mod jars in libs — must go through fg.deobf() so ForgeGradle
    // remaps the classes to match the dev-environment mappings.
    compileOnly fg.deobf(fileTree(dir: 'libs', include: ['*.jar'],
            exclude: ['emi-*.jar', '*irons_spellbooks-1.20.1-3.16.3.jar', 'apothic_staff_rarities-*.jar',
                      'fantasy_ending-1.20.1-2.7.20g-all.jar', 'improve_the_expectations-1.0.2-forge-1.20.1.jar']))

    // A production RS jar in run/mods is not remapped for the userdev namespace.
    // Keep the release artifact compile-only, but provide a deobfuscated runtime copy for dev runs.
    runtimeOnly fg.deobf("local:refinedstorage:1.12.4")

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    // EMI (optional client integration)
    if (file("libs/emi-${emi_version}+forge.jar").exists()) {
        compileOnly fg.deobf("local:emi:${emi_version}+forge")
    } else {
        compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    }

    // Curios
    compileOnly fg.deobf(files('libs/curios-forge-5.14.1+1.20.1.jar'))

    // JSR-305 annotations (@Nullable / @Nonnull / @ParametersAreNonnullByDefault)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras — common API for @WrapOperation etc. (compile + AP).
    // The annotation processor lives in mixinextras-common.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.6"))

    // Jar-in-Jar: ForgeGradle nests mixinextras-forge.jar inside
    // META-INF/jarjar/ so Forge can do version arbitration at launch.
    // Avoids JPMS split-package conflicts with other mods that also
    // bundle MixinExtras.  Never shade or shadow — that extracts classes
    // into the root and triggers ResolutionException.
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.3.6")) {
        jarJar.ranged(it, "[0.3.6,)")
    }

    // ── Unit tests ──────────────────────────────────────────────
    // JUnit 5. Tests run against the deobf Minecraft on the compile
    // classpath (ForgeGradle adds it to every source set), so layer-2
    // tests can exercise real ItemStack/NBT after Bootstrap.bootStrap().
    // Ledger boundary tests also use the same remapped RS API as dev runs.
    // This does not bootstrap the mod entry point or a running Forge server.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation fg.deobf("local:refinedstorage:1.12.4")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 混合终端与配方预览测试需要编译、加载 JEI 接口。
    testImplementation "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    testImplementation "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

compileBenchmarkJava {
    options.encoding = 'UTF-8'
}

// 用 manifest 承载长 classpath，避免 Windows 下 JMH fork 超出命令长度。
tasks.register('benchmarkClasspath', Jar) {
    dependsOn tasks.named('benchmarkClasses')
    archiveFileName = 'benchmark-classpath.jar'
    destinationDirectory = layout.buildDirectory.dir('benchmark')
    doFirst {
        manifest.attributes('Class-Path': sourceSets.benchmark.runtimeClasspath.files
                .collect { it.toURI().toASCIIString() }.join(' '))
    }
}

tasks.register('diskBenchmark', JavaExec) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn tasks.named('benchmarkClasspath')
    classpath = files(tasks.named('benchmarkClasspath').flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'
    maxHeapSize = '3g'
    args providers.gradleProperty('benchmarkArgs').getOrElse('-l').split(' ').findAll { !it.isEmpty() }
}

tasks.register('diskLimitCheck', JavaExec) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    dependsOn tasks.named('benchmarkClasspath')
    classpath = files(tasks.named('benchmarkClasspath').flatMap { it.archiveFile })
    mainClass = 'com.huanghuang.rsintegration.benchmark.UnifiedDiskLimitCheck'
    maxHeapSize = '3g'
    args layout.buildDirectory.dir('benchmark/limits').get().asFile.absolutePath
}

tasks.register('diskBenchmarkSuite', JavaExec) {
    dependsOn tasks.named('benchmarkClasspath')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = files(tasks.named('benchmarkClasspath').flatMap { it.archiveFile })
    mainClass = 'com.huanghuang.rsintegration.benchmark.UnifiedDiskBenchmarkSuite'
    maxHeapSize = '3g'
    args layout.buildDirectory.dir('benchmark').get().asFile.absolutePath
}

tasks.register('diskOptimizationSuite', JavaExec) {
    dependsOn tasks.named('benchmarkClasspath')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = files(tasks.named('benchmarkClasspath').flatMap { it.archiveFile })
    mainClass = 'com.huanghuang.rsintegration.benchmark.UnifiedDiskBenchmarkSuite'
    maxHeapSize = '3g'
    // 单独目录保留优化前的原始结果。
    args layout.buildDirectory.dir('benchmark/optimized').get().asFile.absolutePath, 'optimized'
}

tasks.register('diskComprehensiveSuite', JavaExec) {
    dependsOn tasks.named('benchmarkClasspath')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = files(tasks.named('benchmarkClasspath').flatMap { it.archiveFile })
    mainClass = 'com.huanghuang.rsintegration.benchmark.UnifiedDiskBenchmarkSuite'
    maxHeapSize = '3g'
    args layout.buildDirectory.dir('benchmark/comprehensive').get().asFile.absolutePath, 'comprehensive'
}

tasks.register('diskCompatibilityCheck', JavaExec) {
    dependsOn tasks.named('benchmarkClasspath')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = files(tasks.named('benchmarkClasspath').flatMap { it.archiveFile })
    mainClass = 'com.huanghuang.rsintegration.benchmark.UnifiedDiskCompatibilityCheck'
    maxHeapSize = '3g'
    args providers.gradleProperty('legacyDiskManifest').getOrElse(''),
            layout.buildDirectory.file('benchmark/comprehensive/compatibility.json').get().asFile.absolutePath
}

tasks.register('verifyNoForcedChunkLoads') {
    doLast {
        def violations = []
        fileTree('src/main/java') { include '**/*.java' }.each { source ->
            if (source.name == 'RemoteGuiAuth.java') return
            def text = source.getText('UTF-8')
            if (text.contains('ChunkUtils.loadChunk') || text =~ /\.getChunk\s*\(/) {
                violations << source
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('Remote operations must not load chunks directly: '
                    + violations.join(', '))
        }
    }
}

check.dependsOn tasks.named('verifyNoForcedChunkLoads')

test {
    useJUnitPlatform()
    // ForgeGradle rewrites the run classpath; keep test output quiet but
    // surface failures.
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

compileJava {
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "mod_version", project.version
    inputs.property "mod_id", mod_id
    inputs.property "mod_name", mod_name

    filesMatching("META-INF/mods.toml") {
        expand(
                "mod_version": mod_version,
                "mod_id": mod_id,
                "mod_name": mod_name
        )
    }

    from("LICENSE") {
        into "META-INF"
        rename { "LICENSE_RS_INTEGRATION" }
    }

    // Mirror the English lang file into data/ so a DEDICATED SERVER can resolve
    // our keys. Forge's LanguageHook.loadLanguagesOnServer only reads
    // data/<ns>/lang/en_us.json; assets/ is client-only, so without this a
    // server-side Component.getString() yields the raw key. This is a safety
    // net for log output and any path that slips through — the real fix is to
    // ship unresolved Components to the client (see PlanResponse.modWarnings).
    from("src/main/resources/assets/${mod_id}/lang/en_us.json") {
        into "data/${mod_id}/lang"
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : "Huanghuang",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Huanghuang",
                "MixinConfigs"            : "rs_integration.mixins.json,rs_integration.craftflow_compat.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

// jarJar normally creates an "all" artifact. Drop the classifier so the
// reobfuscated Jar-in-Jar is the distributable file.
tasks.named('jarJar', Jar) {
    dependsOn 'reobfJar'
    archiveClassifier = ''
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : "Huanghuang",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Huanghuang",
                "MixinConfigs"            : "rs_integration.mixins.json,rs_integration.craftflow_compat.mixins.json"
        ])
    }
}

tasks.configureEach {
    if (name == 'jarJar') {
        finalizedBy 'reobfJarJar'
    }
}

tasks.register('verifyReleaseJar') {
    dependsOn 'reobfJarJar'
    doLast {
        def archive = tasks.named('jarJar', Jar).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def requiredEntries = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/mods.toml',
                    'META-INF/LICENSE_RS_INTEGRATION',
                    'META-INF/licenses/MIT-MixinExtras.txt',
                    'META-INF/jarjar/metadata.json',
                    'META-INF/jarjar/mixinextras-forge-0.3.6.jar',
                    'com/huanghuang/rsintegration/compat/emi/RSEmiPlugin.class',
                    'rs_integration.mixins.json',
                    'rs_integration.craftflow_compat.mixins.json',
                    'rs_integration.refmap.json'
            ]
            requiredEntries.each { entryName ->
                if (zip.getEntry(entryName) == null) {
                    throw new GradleException("Release jar is missing ${entryName}: ${archive}")
                }
            }

            def forbiddenFragments = [
                    'tinypinyin',
                    'ahocorasick',
                    'com/github/promeg/',
                    'dev/emi/emi/'
            ]
            zip.entries().each { entry ->
                def lowerName = entry.name.toLowerCase(java.util.Locale.ROOT)
                forbiddenFragments.each { fragment ->
                    if (lowerName.contains(fragment)) {
                        throw new GradleException(
                                "Release jar contains removed pinyin dependency ${entry.name}: ${archive}")
                    }
                }
            }

            ['rs_integration.mixins.json', 'rs_integration.craftflow_compat.mixins.json'].each { configName ->
                def mixinConfigEntry = zip.getEntry(configName)
                def mixinConfig = new groovy.json.JsonSlurper().parse(zip.getInputStream(mixinConfigEntry))
                ['mixins', 'client', 'server'].each { side ->
                    (mixinConfig[side] ?: []).each { mixinName ->
                        def className = "${mixinConfig.package}.${mixinName}".replace('.', '/') + '.class'
                        if (zip.getEntry(className) == null) {
                            throw new GradleException("Mixin config references missing class ${className}: ${archive}")
                        }
                    }
                }
            }

            def modsEntry = zip.getEntry('META-INF/mods.toml')
            def modsToml = zip.getInputStream(modsEntry).getText('UTF-8')
            if (!modsToml.contains("modId = \"${mod_id}\"")
                    || !modsToml.contains("version = \"${project.version}\"")) {
                throw new GradleException("Release mods.toml has unexpanded or incorrect identity: ${archive}")
            }

            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
            def attributes = manifest.mainAttributes
            if (attributes.getValue('Implementation-Version') != project.version.toString()
                    || attributes.getValue('MixinConfigs') != 'rs_integration.mixins.json,rs_integration.craftflow_compat.mixins.json') {
                throw new GradleException("Release manifest has incorrect version or MixinConfigs: ${archive}")
            }

            def classEntry = zip.getEntry('com/huanghuang/rsintegration/ModItems.class')
            if (classEntry == null) {
                throw new GradleException("Release jar is missing ModItems.class: ${archive}")
            }
            def classBytes = zip.getInputStream(classEntry).bytes
            def classData = new String(classBytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (classData.contains('CREATIVE_MODE_TAB')) {
                throw new GradleException("Release jar still contains development mappings: ${archive}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.configureEach {
    if (name == 'reobfJarJar') {
        finalizedBy tasks.named('verifyReleaseJar')
    }
}
